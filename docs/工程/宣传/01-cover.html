<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PocketAgent 封面</title>
<style>
  :root{
    --paper:#F7F3EA; --ink:#1F1B18; --muted:#6B625C; --accent:#C96442;
    --accent-soft:#E8D5CC; --line:#DED5C8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:460px;overflow:hidden;background:var(--paper)}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
    color:var(--ink);
    position:relative;
  }
  .grain{
    position:absolute;inset:0;
    background-image:radial-gradient(circle at 1px 1px, rgba(31,27,24,.055) 1px, transparent 0);
    background-size:14px 14px;
    pointer-events:none;
  }
  .band{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--accent)}
  .wrap{position:absolute;left:76px;top:62px;right:52px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-size:15px;letter-spacing:.22em;color:var(--muted);
  }
  .eyebrow b{color:var(--accent);font-weight:600;letter-spacing:.06em}
  h1{
    margin-top:22px;
    font-size:74px;line-height:1.02;letter-spacing:-.02em;font-weight:800;
    font-family:Georgia,"Microsoft YaHei",serif;
  }
  h1 span{color:var(--accent)}
  .sub{
    margin-top:20px;font-size:29px;line-height:1.42;color:var(--ink);
    max-width:640px;
  }
  .sub em{font-style:normal;color:var(--accent);font-weight:700}
  .tags{margin-top:26px;display:flex;gap:10px}
  .tag{
    border:1px solid var(--line);border-radius:999px;padding:7px 16px;
    font-size:16px;color:var(--muted);background:rgba(255,255,255,.5)
  }
  .right{position:absolute;right:58px;top:54px;width:300px;height:352px}
  .right .frame{
    position:absolute;inset:0;border:1px solid var(--line);border-radius:18px;
    background:linear-gradient(160deg,#FFFDF8 0%,#F2ECE0 100%);
    box-shadow:0 18px 40px -28px rgba(31,27,24,.45);
  }
  .right svg{position:absolute;left:0;top:0;z-index:2}
  .right .label{
    position:absolute;left:20px;top:16px;z-index:3;
    font-size:12px;letter-spacing:.18em;color:var(--muted)
  }
  .ver{
    position:absolute;left:20px;bottom:16px;z-index:3;
    display:flex;align-items:baseline;gap:3px;
    font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .ver b{font-size:29px;letter-spacing:-.01em;color:var(--ink)}
  .right .frame{z-index:1}
  .dot{fill:var(--accent)}
</style>
</head>
<body>
  <div class="band"></div>
  <div class="grain"></div>

  <div class="wrap">
    <div class="eyebrow"><b>开源 · BYOK</b> / 不联网也行 · Android</div>
    <h1>Pocket<span style="font-family:'Microsoft YaHei';font-weight:800">Agent</span></h1>
    <div class="sub">
      一个会累、会记得、也会忘的<em>手机角色</em>。<br>
      模型只是驱动，人格长在 app 里。
    </div>
    <div class="tags">
      <div class="tag">激素与作息</div>
      <div class="tag">记忆按情绪衰减</div>
      <div class="tag">世界书靠类型防崩</div>
    </div>
  </div>

  <div class="right">
    <div class="frame"></div>
    <div class="label">HER DAY</div>
    <svg width="300" height="352" viewBox="0 0 300 352" shape-rendering="geometricPrecision">
      <g stroke="#DED5C8" stroke-width="1">
        <line x1="24" y1="96" x2="276" y2="96"/>
        <line x1="24" y1="176" x2="276" y2="176"/>
        <line x1="24" y1="256" x2="276" y2="256"/>
      </g>
      <path d="M24 232 C 62 232, 78 120, 112 118 S 168 196, 196 176 S 240 132, 276 142"
            fill="none" stroke="#C96442" stroke-width="3" stroke-linecap="round"/>
      <circle class="dot" cx="112" cy="118" r="5"/>
      <circle class="dot" cx="196" cy="176" r="5"/>
      <text x="24" y="60" font-size="13" fill="#6B625C">多巴胺 / 皮质醇</text>
      <text x="26" y="272" font-size="12.5" fill="#6B625C">04:00　　10:00　　23:00</text>
    </svg>
    <div class="ver"><span>v</span><b>0.1.0-m2</b></div>
  </div>
</body>
</html>
